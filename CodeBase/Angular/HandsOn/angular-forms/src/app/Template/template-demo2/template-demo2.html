<form #regForm="ngForm" (ngSubmit)="onSubmit(regForm)">
    <div>
        <label>Name:</label>
        <input type="text" name="name" ngModel required minlength="3" #name="ngModel">
        <!-- Validation Messages -->
        <div *ngIf="name.invalid && (name.dirty || name.touched)">
            <small *ngIf="name.errors?.['required']">Name is required</small>
            <small *ngIf="name.errors?.['minlength']">Name must be at least 3 characters</small>
        </div>
    </div>

    <div>
        <label>Email:</label>
        <input type="email" name="email" ngModel required email #email="ngModel">
        <div *ngIf="email.invalid && (email.dirty || email.touched)">
            <small *ngIf="email.errors?.['required']">Email is required</small>
            <small *ngIf="email.errors?.['email']">Invalid email format</small>
        </div>
    </div>

    <div>
        <label>Password:</label>
        <input type="password" name="password" ngModel required minlength="6" #password="ngModel">
        <div *ngIf="password.invalid && (password.dirty || password.touched)">
            <small *ngIf="password.errors?.['required']">Password is required</small>
            <small *ngIf="password.errors?.['minlength']">Password must be at least 6 characters</small>
        </div>
    </div>

    <button type="submit" [disabled]="regForm.invalid">Register</button>
</form>
<div *ngIf="submitted">
    <h3>Form Submitted Successfully!</h3>
    <p>Name: {{ regForm.value.name }}</p>
    <p>Email: {{ regForm.value.email }}</p>
</div>
